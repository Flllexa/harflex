name: Release

# A version tag (vX.Y.Z, from `make release VERSION=X.Y.Z`) builds the installers on macOS, Windows and Linux
# and publishes them as a GitHub Release. Run it by hand to build the installers without publishing.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: installers-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Version from the tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0"; fi
          node scripts/set-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libfuse2t64 file
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - run: npm ci
        working-directory: frontend
      - name: Build the installers
        env:
          UNIVERSAL: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: wails3 task installers UNIVERSAL="$UNIVERSAL"
      - name: Name the installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          shopt -s nullglob
          case "${{ matrix.platform }}" in
            macos) cp bin/*.dmg "release/Harflex-$VERSION-macos-universal.dmg" ;;
            windows) for file in bin/*-installer.exe build/windows/nsis/*-installer.exe; do cp "$file" "release/Harflex-$VERSION-windows-amd64-setup.exe"; done ;;
            linux)
              for file in bin/*.AppImage; do cp "$file" "release/Harflex-$VERSION-linux-x86_64.AppImage"; done
              for file in bin/*.deb; do cp "$file" "release/Harflex-$VERSION-linux-amd64.deb"; done
              for file in bin/*.rpm; do cp "$file" "release/Harflex-$VERSION-linux-x86_64.rpm"; done
              ;;
          esac
          ls -la release
          test -n "$(ls release)"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Instalação

          | Sistema | Arquivo |
          | --- | --- |
          | macOS (Apple Silicon e Intel) | `Harflex-*-macos-universal.dmg` |
          | Windows 10/11 | `Harflex-*-windows-amd64-setup.exe` |
          | Linux | `.AppImage`, `.deb` ou `.rpm` |

          Os instaladores não são assinados por uma autoridade. No macOS, na primeira vez, clique com o botão direito no app e escolha **Abrir**. No Windows, em "O Windows protegeu o computador", clique em **Mais informações** e **Executar assim mesmo**.

          Confira a integridade com `SHA256SUMS.txt`.
          EOF
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "Harflex $TAG" --notes-file notes.md --generate-notes --verify-tag
