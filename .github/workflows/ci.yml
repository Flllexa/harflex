name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # main.go embeds frontend/dist, which is intentionally not versioned.
      - run: go test ./... -race
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'
      - run: node --test scripts/release-gates.test.mjs
      - name: Check committed whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --check "$PR_BASE_SHA"..HEAD
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA"..HEAD
          else
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
            base=""
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              if ! git show-ref --verify --quiet "$default_ref"; then
                git fetch --no-tags origin "$DEFAULT_BRANCH:$default_ref" || true
              fi
              if git show-ref --verify --quiet "$default_ref"; then
                base="$(git merge-base HEAD "$default_ref" || true)"
              fi
            fi
            if [ -z "$base" ]; then
              empty="$(git hash-object -t tree /dev/null)"
              git diff --check "$empty" HEAD
            else
              git diff --check "$base"..HEAD
            fi
          fi

  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - run: npm ci
        working-directory: frontend
      # setup-go adds GOPATH/bin to PATH on both bash and PowerShell runners.
      # Build only: no package/sign commands, credentials or release publication.
      - run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-smoke-${{ matrix.platform }}
          path: bin/harflex*
          if-no-files-found: error
          retention-days: 7
